services:
  robot:
    build: .
    image: biped:latest
    container_name: biped
    network_mode: host
    ipc: host
    privileged: true
    volumes:
      - /dev:/dev
      - ./ws/src:/ws/src
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
    command: ros2 launch biped_control bringup.launch.py ${LAUNCH_ARGS:-}
